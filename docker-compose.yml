services:
  web:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8888 --workers 1
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    restart: unless-stopped

  scheduler:
    build: .
    command: python -m backend.trading.jobs.scheduler
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - web

