services:
  web:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8888 --workers 1
    ports:
      - "${STOCKPULSE_BIND_HOST:-0.0.0.0}:${STOCKPULSE_PORT:-8888}:8888"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/stock.db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8888/api/health', timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build: .
    command: python -m backend.trading.jobs.scheduler
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/stock.db
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  # 本文件只用于内网/VPN/受控安全组的 IP + 端口模式。
  # 公网部署必须单独使用 deploy/docker-compose.public.yml，且不得叠加本文件。
