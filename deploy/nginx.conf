# Nginx 反向代理配置模板(spec §13.2/§16)
#
# 公网部署必需:HTTPS + Basic Auth,禁止直接暴露 8888 端口。
# 用法:
#   1. 将本文件放到 deploy/nginx.conf
#   2. 提供 SSL 证书到 deploy/certs/(cert.pem + key.pem)
#   3. 生成 htpasswd: htpasswd -c deploy/htpasswd <username>
#   4. 在 docker-compose.yml 取消 nginx 服务注释
#   5. docker-compose up -d

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # SSL 证书(勿提交到 Git)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Basic Auth(勿提交 htpasswd 到 Git)
    auth_basic           "StockPulse";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 反向代理到 FastAPI
    location / {
        proxy_pass http://web:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location /assets/ {
        proxy_pass http://web:8888;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
